name: Build Android APK
on:
  push:
    branches: [main, android-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Android project
        run: | python3 - <<'PYTHON' import base64, json, pathlib files = json.loads(base64.b64decode('')) for name, content in files.items(): path = pathlib.Path(name) path.parent.mkdir(parents=True, exist_ok=True) path.write_text(content) PYTHON       - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK and lint
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Floppy-Bird-2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
